{% extends "base.html" %}

{% block title %}Edit Word{% endblock %}

{% block content %}
<h1 class="mb-4 text-white">
    <i class="bi bi-pencil-fill"></i> Edit Word: {{ word.word }}
</h1>

<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card p-4">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="word" class="form-label">Word *</label>
                        <input type="text" class="form-control" id="word" name="word" value="{{ word.word }}" required>
                    </div>
                    
                    <div class="col-md-3 mb-3">
                        <label for="category" class="form-label">Category/Game Mode *</label>
                        <select class="form-select" id="category" name="category" required>
                            {% for mode in game_modes %}
                                <option value="{{ mode }}" {% if word.category == mode %}selected{% endif %}>{{ mode }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-3 mb-3">
                        <label for="difficulty" class="form-label">Difficulty *</label>
                        <select class="form-select" id="difficulty" name="difficulty" required>
                            <option value="easy" {% if word.difficulty == 'easy' %}selected{% endif %}>Easy</option>
                            <option value="medium" {% if word.difficulty == 'medium' %}selected{% endif %}>Medium</option>
                            <option value="hard" {% if word.difficulty == 'hard' %}selected{% endif %}>Hard</option>
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="hint" class="form-label">Hint</label>
                    <input type="text" class="form-control" id="hint" name="hint" value="{{ word.hint or '' }}" 
                           placeholder="Optional hint for the player">
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="answer" class="form-label">Answer</label>
                        <input type="text" class="form-control" id="answer" name="answer" value="{{ word.answer or '' }}" 
                               placeholder="For Slang, Chain, Alpha-Thon">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="translation" class="form-label">Translation</label>
                        <input type="text" class="form-control" id="translation" name="translation" value="{{ word.translation or '' }}" 
                               placeholder="For Translate mode">
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="opposite" class="form-label">Opposite</label>
                        <input type="text" class="form-control" id="opposite" name="opposite" value="{{ word.opposite or '' }}" 
                               placeholder="For Opposites mode">
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="rhyme_with" class="form-label">Rhyme With</label>
                        <input type="text" class="form-control" id="rhyme_with" name="rhyme_with" value="{{ word.rhyme_with or '' }}" 
                               placeholder="For Rhyme Time mode">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="context_sentence" class="form-label">Context Sentence</label>
                    <textarea class="form-control" id="context_sentence" name="context_sentence" rows="3" 
                              placeholder="For Contextual mode - use the word in a sentence">{{ word.context_sentence or '' }}</textarea>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {{ 'checked' if word.is_active }}>
                    <label class="form-check-label" for="is_active">Active</label>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-save-fill"></i> Update Word
                    </button>
                    <a href="{{ url_for('admin.list_words') }}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Puzzle Game - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }
        
        .tab:hover {
            color: #667eea;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-warning {
            background: #ffc107;
            color: #333;
        }
        
        .btn-warning:hover {
            background: #e0a800;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .data-table th {
            background: #667eea;
            color: white;
        }
        
        .data-table tr:hover {
            background: #f5f5f5;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Word Puzzle Game</h1>
        <p class="subtitle">Admin Panel - Manage Players and Words</p>
        
        <div id="message" class="message"></div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('players')">Players</button>
            <button class="tab" onclick="switchTab('words')">Words</button>
        </div>
        
        <!-- Players Tab -->
        <div id="players-tab" class="tab-content active">
            <div class="form-section">
                <h2>Add New Player</h2>
                <form id="player-form">
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="player-username" required>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Slang Score</label>
                            <input type="number" id="player-slang" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Rhyme Time Score</label>
                            <input type="number" id="player-rhyme" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Translate Score</label>
                            <input type="number" id="player-translate" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Contextual Score</label>
                            <input type="number" id="player-contextual" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Chain Score</label>
                            <input type="number" id="player-chain" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Opposites Score</label>
                            <input type="number" id="player-opposites" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Alpha-Thon Score</label>
                            <input type="number" id="player-alpha" value="0" min="0">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Player</button>
                </form>
            </div>
            
            <h2>All Players</h2>
            <button onclick="loadPlayers()" class="btn btn-primary">Refresh List</button>
            <table class="data-table" id="players-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Slang</th>
                        <th>Rhyme</th>
                        <th>Translate</th>
                        <th>Context</th>
                        <th>Chain</th>
                        <th>Opposites</th>
                        <th>Alpha</th>
                        <th>Avg</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="players-tbody">
                    <tr><td colspan="11" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        
        <!-- Words Tab -->
        <div id="words-tab" class="tab-content">
            <div class="form-section">
                <h2>Add New Word</h2>
                <form id="word-form">
                    <div class="form-group">
                        <label>Word *</label>
                        <input type="text" id="word-word" required>
                    </div>
                    <div class="form-group">
                        <label>Meaning</label>
                        <input type="text" id="word-meaning">
                    </div>
                    <div class="form-group">
                        <label>Language</label>
                        <input type="text" id="word-language">
                    </div>
                    <div class="form-group">
                        <label>English Translation</label>
                        <input type="text" id="word-translated">
                    </div>
                    <div class="form-group">
                        <label>Example Usage</label>
                        <input type="text" id="word-example">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Word</button>
                </form>
            </div>
            
            <h2>All Words</h2>
            <button onclick="loadWords()" class="btn btn-primary">Refresh List</button>
            <table class="data-table" id="words-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Word</th>
                        <th>Meaning</th>
                        <th>Language</th>
                        <th>Translation</th>
                        <th>Example</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="words-tbody">
                    <tr><td colspan="7" style="text-align: center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
